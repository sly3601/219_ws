# 仿真和真机共用的 RLWALK 配置，只在这里修改。
sysu219_guide_controller:
  ros__parameters:
    # 1=AR002平滑基线，2=AR003更强调平滑，3=AR002/8ms延迟适应。
    # 修改后重启对应 launch；站稳后键盘按7进入，旧模型不再使用。
    rl_policy_id: 3
    rl_pose_transition_s: 0.5
    rl_entry_timeout_s: 5.0
    rl_entry_tolerance_rad: 0.25
    rl_entry_velocity_rad_s: 1.0
    rl_max_control_period_s: 0.1
