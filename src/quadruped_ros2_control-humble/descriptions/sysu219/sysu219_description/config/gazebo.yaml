# Controller Manager configuration
controller_manager:
  ros__parameters:
    update_rate: 500  # Hz

    # Define the available controllers
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    imu_sensor_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster

    leg_pd_controller:
      type: leg_pd_controller/LegPdController

    sysu219_guide_controller:
      type: sysu219_guide_controller/Sysu219GuideController

    rl_quadruped_controller:
      type: rl_quadruped_controller/LeggedGymController

imu_sensor_broadcaster:
  ros__parameters:
    sensor_name: "imu_sensor"
    frame_id: "imu_link"

leg_pd_controller:
  ros__parameters:
    update_rate: 500  # Hz
    # FR/FL/RR/RL x hip/thigh/calf; match HardwareSysu219's current command limits.
    effort_limits: [100.0, 100.0, 100.0, 100.0, 100.0, 100.0,
                    100.0, 100.0, 100.0, 100.0, 100.0, 100.0]
    velocity_limits: [19.95, 19.95, 20.0, 19.95, 19.95, 20.0,
                      19.95, 19.95, 20.0, 19.95, 19.95, 20.0]
    position_min: [-0.638, -0.623, -2.322, -0.638, -0.623, -2.322,
                   -0.638, -0.623, -2.322, -0.638, -0.623, -2.322]
    position_max: [0.748, 1.65, -0.672, 0.748, 1.65, -0.672,
                   0.748, 1.65, -0.672, 0.748, 1.65, -0.672]
    # Seconds: adjustable actuator assumption (one 250 Hz command interval), NOT identified motor bandwidth.
    torque_response_time: 0.004
    joints:
      - FR_hip_joint
      - FR_thigh_joint
      - FR_calf_joint
      - FL_hip_joint
      - FL_thigh_joint
      - FL_calf_joint
      - RR_hip_joint
      - RR_thigh_joint
      - RR_calf_joint
      - RL_hip_joint
      - RL_thigh_joint
      - RL_calf_joint

    command_interfaces:
      - effort

    state_interfaces:
      - position
      - velocity

sysu219_guide_controller:
  ros__parameters:
    use_sim_time: true
    gazebo_com_visualization: true
    update_rate: 250  # Hz
    command_prefix: "leg_pd_controller"
    joints:
      - FR_hip_joint
      - FR_thigh_joint
      - FR_calf_joint
      - FL_hip_joint
      - FL_thigh_joint
      - FL_calf_joint
      - RR_hip_joint
      - RR_thigh_joint
      - RR_calf_joint
      - RL_hip_joint
      - RL_thigh_joint
      - RL_calf_joint

    command_interfaces:
      - effort
      - position
      - velocity
      - kp
      - kd

    state_interfaces:
      - effort
      - position
      - velocity

    feet_names:
      - FR_foot
      - FL_foot
      - RR_foot
      - RL_foot

    imu_name: "imu_sensor"
    base_name: "base"

    # ===== 固定姿态参数 =====
    # 每个姿态 12 个关节角，顺序 FR/FL/RR/RL × (hip, thigh, calf)，单位 rad
    # 站立姿态（FIXEDSTAND）
    stand_pos: [0.0, 0.9, -1.53,
                0.0, 0.9, -1.53,
                0.0, 0.9, -1.3,
                0.0, 0.9, -1.3]
    # 半趴姿态（FIXEDDOWN）
    # 取值来源：tools/config/joint_states/joint_snapshot_20260923_112924.yaml
    down_pos: [-0.054, 1.111, -2.155,
               0.054, 1.111, -2.155,
               -0.163, 0.999, -2.094,
               0.163, 0.999, -2.094]
    # 全趴姿态（FIXEDPRONE，PASSIVE 按 2 进入）
    # 取值来源：tools/config/joint_states/joint_snapshot_20260923_213557.yaml
    # 已对左右腿取平均（FR↔FL、RR↔RL），使左右完全对称
    prone_pos: [-0.394, 1.599, -2.519,
                0.394, 1.599, -2.519,
                -0.435, 1.587, -2.490,
                0.435, 1.587, -2.490]

    # 固定姿态的 MIT 增益（FIXEDDOWN / FIXEDSTAND 共用）
    stand_kp: 260.0
    stand_kd: 3.8

    # FIXEDPRONE 专用增益。FIXEDPRONE 的 kp/kd 从"进入时的实际值"斜坡到这两个值，
    # 所以从 FIXEDDOWN 切进来时会从 260/3.8 平滑过渡，不会突变。
    # hip 在 down->prone 要转 0.28~0.44 rad，若出现粘滑振荡优先加 prone_kd。
    prone_kp: 260.0
    prone_kd: 3.8

    imu_interfaces:
      - orientation.w
      - orientation.x
      - orientation.y
      - orientation.z
      - angular_velocity.x
      - angular_velocity.y
      - angular_velocity.z
      - linear_acceleration.x
      - linear_acceleration.y
      - linear_acceleration.z
